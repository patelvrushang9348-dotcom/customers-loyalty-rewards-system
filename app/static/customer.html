<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Box Rewards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="tape"></div>
<header class="top"><b>Box Rewards</b><button id="logout" class="ghost small hidden">Log out</button></header>
<main class="wrap narrow">

  <section id="auth">
    <h1>Every box earns you something.</h1>
    <p class="muted">Find the code printed inside the box, enter it here, and collect points toward rewards.</p>
    <div class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-login" aria-selected="true">Log in</button>
        <button role="tab" id="tab-register" aria-selected="false">Create account</button>
      </div>
      <form id="auth-form">
        <div id="name-wrap" class="hidden"><label for="name">Your name</label><input id="name" autocomplete="name" maxlength="80"></div>
        <label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
        <label for="password">Password (8+ characters)</label><input id="password" type="password" autocomplete="current-password" required minlength="8">
        <p><button id="auth-submit" type="submit">Log in</button></p>
        <div id="auth-msg" class="msg" role="status"></div>
      </form>
    </div>
  </section>

  <section id="app" class="hidden">
    <div class="panel">
      <p class="muted" id="hello"></p>
      <div class="balance"><span class="n" id="balance">0</span><span>points</span></div>
    </div>

    <div class="panel">
      <h2>Enter your box code</h2>
      <form id="redeem-form" class="label-input">
        <label for="code" class="hidden">Box code</label>
        <input id="code" placeholder="XXXX-XXXX-XXXX-XX" maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" required>
        <p style="margin:.8rem 0 0;text-align:center"><button type="submit">Add points</button></p>
      </form>
      <div id="redeem-msg" class="msg" role="status"></div>
    </div>

    <div class="panel"><h2>Rewards</h2><div id="rewards" class="rewards"></div><div id="reward-msg" class="msg" role="status"></div></div>

    <div class="panel"><h2>Your claims</h2><div class="scroll"><table><thead><tr><th>Reward</th><th class="num">Points</th><th>Status</th><th>Date</th></tr></thead><tbody id="claims"></tbody></table></div></div>
    <div class="panel"><h2>Points history</h2><div class="scroll"><table><thead><tr><th>Date</th><th>What</th><th class="num">Points</th></tr></thead><tbody id="ledger"></tbody></table></div></div>
  </section>
</main>
<script type="module" src="/static/customer.js"></script>
</body>
</html>
